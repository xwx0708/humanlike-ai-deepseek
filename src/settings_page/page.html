<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 类人 AI</title>
<style>
  :root {
    --bg: #f6f7f8; --panel: #ffffff; --ink: #1d2329; --ink-2: #4a545e; --muted: #7c8792; --line: #e2e6ea;
    --accent: #2f6f9f; --accent-soft: #e6f0f7; --changed: #b5651d; --off: #a3acb5;
    --tip-bg: #1d2329; --tip-ink: #f1f4f6;
    font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111518; --panel: #171c20; --ink: #e5eaee; --ink-2: #b9c2ca; --muted: #85909a; --line: #2a3238;
            --accent: #7fb4dc; --accent-soft: #1d2b36; --changed: #e0a56a; --off: #5c666f; --tip-bg: #e5eaee; --tip-ink: #111518; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 16px; padding: 12px 28px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header .path { color: var(--muted); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; border-radius: 6px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #0e1316; } }
  button:focus-visible, input:focus-visible, select:focus-visible, .q:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #notice { margin: 0 28px; padding: 10px 14px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); display: none; }
  #notice.show { display: block; margin-top: 14px; }
  #notice code { font-size: 12.5px; }
  .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; padding: 0 28px; max-width: 1180px; flex: 1; min-height: 0; }
  main { overflow-y: auto; overflow-x: hidden; min-height: 0; padding: 18px 4px 80px 0; }  /* 只上下滚；内容不许横向溢出 */
  section, .with-preview > div, .row, .ctl { min-width: 0; }
  nav { display: flex; flex-direction: column; overflow-y: auto; min-height: 0; padding: 18px 4px 40px 0; scrollbar-width: none; }  /* 左右两块各自滚：鼠标在哪块就滚哪块；左栏不显示滚动条 */
  nav::-webkit-scrollbar { display: none; }
  nav a { color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-left: 2px solid transparent; font-size: 13.5px; }
  nav a:hover { color: var(--ink); border-left-color: var(--line); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 22px 8px; margin-bottom: 18px; scroll-margin-top: 12px; }
  .preview { margin: 4px 0 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .with-preview { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
  .with-preview .preview { position: sticky; top: 4px; margin: 10px 0; }
  .with-preview .row { grid-template-columns: minmax(120px, 160px) minmax(0, 1fr) auto; }
  .preview .note { color: var(--muted); font-size: 12.5px; margin: 0 0 6px; }
  .preview .legend { flex-direction: column; gap: 4px; }
  .preview .legend input { width: 52px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .two-col .row { grid-template-columns: minmax(0, 1fr) auto auto; padding: 6px 0; }
  .pair { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  nav .group { margin: 12px 0 4px; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  nav .group:first-child { margin-top: 0; }
  .group-title { margin: 26px 0 10px; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .group-title:first-child { margin-top: 0; }
  .persona textarea { width: 100%; min-height: 220px; resize: vertical; font: inherit; font-size: 13.5px; line-height: 1.6;
                      background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .persona .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .persona .bar .unit { margin-left: auto; }
  .persona .bar a.ext { color: var(--changed); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .persona .bar a.ext:hover { color: var(--ink); }
  .warn { grid-column: 1 / -1; margin: -4px 0 4px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.5;
          background: rgba(229, 102, 91, .12); color: #e5665b; border: 1px solid rgba(229, 102, 91, .35); }
  .pair input[type=number] { width: 72px; }
  @media (max-width: 1100px) { .with-preview { grid-template-columns: 1fr; } .with-preview .preview { position: static; } }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }
  .preview .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 600; }
  .preview svg { width: 100%; height: auto; display: block; }
  .preview .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; font-size: 12.5px; }
  .preview .legend > span { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 0; border-top: 1px dashed var(--line); }
  .preview .legend b, .preview .legend .unit { white-space: nowrap; }
  .preview .legend .unit { flex-basis: 100%; padding-left: 26px; }
  .preview .legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
  .preview .legend input { width: 58px; }
  .preview .axis { stroke: var(--muted); stroke-width: 1; }
  .preview .grid { stroke: var(--line); stroke-width: 1; }
  .preview text { fill: var(--muted); font-size: 11px; }
  .preview .curve { fill: none; stroke-width: 2.2; }
  .preview .line { stroke: var(--off); stroke-width: 1; stroke-dasharray: 5 4; }
  section h2 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  section > p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .row { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) auto; gap: 14px; align-items: center;
         padding: 9px 0; border-top: 1px solid var(--line); }
  .row label { display: flex; align-items: center; gap: 6px; color: var(--ink); }
  .row.changed label { color: var(--changed); }
  .ctl { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ctl input[type=range] { flex: 1; min-width: 80px; accent-color: var(--accent); }
  .ctl input[type=number] { width: 110px; }
  .ctl input[type=text] { width: 100%; }
  input[type=number], input[type=text], select { font: inherit; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .unit { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .dflt { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .reset { border: none; background: none; color: var(--muted); padding: 2px 4px; font-size: 13px; visibility: hidden; }
  .row.changed .reset { visibility: visible; }

  /* 圆圈问号：悬停或聚焦时浮现解释 */
  .q { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%;
       border: 1px solid var(--muted); color: var(--muted); font-size: 11px; line-height: 1; cursor: help; flex: none; font-weight: 400; }
  .q::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-20%);
              width: max-content; max-width: 360px; white-space: normal; padding: 8px 10px; border-radius: 6px;
              background: var(--tip-bg); color: var(--tip-ink); font-size: 12.5px; line-height: 1.6; text-align: left;
              opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 10; }
  .q:hover::after, .q:focus::after { opacity: 1; }

  .ctl > button { flex: none; white-space: nowrap; }
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 49; }
  .picker { position: fixed; top: 10vh; left: 50%; transform: translateX(-50%); width: min(560px, 92vw); max-height: 80vh; overflow: auto;
            background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; z-index: 50;
            box-shadow: 0 12px 40px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 10px; }
  .picker h3 { margin: 0; font-size: 15px; flex: 1; }
  .picker .x { margin-left: auto; width: 28px; height: 28px; padding: 0; font-size: 18px; line-height: 1; border-radius: 6px; }
  .picker .bar { display: flex; gap: 8px; align-items: center; }
  .picker code { font-size: 12.5px; word-break: break-all; }
  .picker .dirs { display: flex; flex-direction: column; max-height: 48vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  .picker .dir { padding: 6px 10px; cursor: pointer; }
  .picker .dir:hover { background: var(--bg); }
  .picker.libs a.dir { display: block; text-decoration: none; color: var(--ink); border-radius: 6px; }
  .picker.libs a.dir b { color: var(--changed); }
  .picker.libs .group-title { margin: 8px 0 2px; }
  .picker.libs .note { margin: 0; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--off); transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 12px; border: 1px solid var(--line);
          background: var(--bg); font-size: 13px; cursor: pointer; user-select: none; }
  .chip.off { color: var(--off); text-decoration: line-through; }
  .chip.custom { border-color: var(--accent); color: var(--accent); }
  .chip.custom b { font-weight: 400; margin-left: 2px; }
  .add { display: flex; gap: 6px; margin-top: 8px; }
  .add input { width: 180px; }
  .wordrow { grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); align-items: start; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; padding: 0 16px; }
    nav { display: none; }
    .row { grid-template-columns: 1fr; gap: 6px; }
    header { padding: 10px 16px; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1>设置</h1>
  <span class="path" id="path"></span>
  <button id="lang" type="button" title="Switch language / 切换语言">Eng</button>
  <button id="resetAll" type="button">全部恢复默认</button>
  <button id="save" class="primary" type="button">保存</button>
</header>
<div id="notice" role="status"></div>
<div class="layout">
  <nav id="nav" aria-label="设置分区"></nav>
  <main id="main"></main>
</div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
};
const q = tip => h('span', { class: 'q', tabindex: '0', 'data-tip': tip, 'aria-label': tip, role: 'note' }, '?');

let SCHEMA, state;   // state：{分区: {参数: 值}, features: {...}, keywords: {...}}
let EN = {};         // 英文文案（服务端从 en.json 读来）；默认中文，缺的条目回落到中文
let ASTRBOT = [];    // AstrBot 当前启用的思考模型（Docker/AstrBot 部署时以它为准，D29）
let lang = 'zh';
try { lang = localStorage.getItem('humanlike.lang') === 'en' ? 'en' : 'zh'; } catch (e) {}
const ZH = {
  title: '设置', path: '设置文件：', restore_all: '全部恢复默认', save: '保存', default: '默认', default_on: '默认 开启',
  empty: '（空）', reset: '恢复默认', features: '功能开关', features_help: '可以单独停用任一功能：关闭后对应的行为不再发生，参数保留。',
  keywords: '关键词表', keywords_help: '用户对记忆的要求按关键词识别（D29）。点击默认的词停用它（显示删除线），在下方添加自己的说法；自定义的词点击即可删除。',
  chip_on: '点击停用', chip_off: '点击启用', chip_del: '点击删除', add_placeholder: '加一个自己的说法', add: '添加', add_label: '：添加说法',
  saved: '已保存到 ', save_failed: '保存失败：', load_failed: '读取设置失败：',
  confirm_restore: '把所有设置恢复为默认值？保存后才会写入文件。', restored: '已恢复为默认值，点"保存"写入文件。',
  restart_hint: '重启后生效：Docker 部署运行 docker compose restart astrbot。', lang_button: 'Eng',
  astrbot_label: 'AstrBot 当前思考模型', astrbot_help: '对话用的思考模型以 AstrBot 网页里选的为准；这里显示 AstrBot 配置里启用的模型。不用 AstrBot（命令行平台）时在 .env 里配。',
  pick: '选择…', pick_title: '选择文件夹', pick_up: '上一级', pick_here: '就用这个文件夹', pick_cancel: '取消', drives: '（盘）',
  at_most: '最多', times_every: '次，每', days_in: '天内', pair_default: '{n} 次 / {d} 天', other: '其他',
  chart_title: '遗忘曲线预览', chart_note: '三条线是三种记忆：越动情、越重要，忘得越慢。改左边的参数，或改下面三组数字，看曲线怎么变。',
  chart_help: '横轴是记忆时间（按记忆时钟计：对话中流速加快，不聊天时几乎停住），纵轴是记忆强度。三条线是三段假想的记忆，越动情、越重要的事忘得越慢：半衰期 = 基础半衰期 × 情绪倍数^情绪 × 重要性倍数^重要（× 首尾加成）。曲线跌破虚线（遗忘阈值）就退出扫描、等待批量遗忘。左边的参数一改，图立刻跟着变。',
  lv1: '随口一提的小事', lv2: '有点在意的事', lv3: '动情又重要的事', emotion: '情绪', importance: '重要',
  emotion_help: '这段话让它有多激动，0 = 和平时一样，1 = 最激动。公式里叫相对唤醒度 a。', importance_help: '这件事对对方有多重要，0 = 无关紧要，1 = 人生大事。公式里叫重要性 i。',
  never_forget: '永不遗忘', forget_after: '约 {d} 天后忘掉', half_life: '（半衰期 {h} 天）', level_default: '默认 情绪 {a} / 重要 {i}',
  edge_label: '算作一场对话的首尾片段（首尾加成）', axis: '横轴范围', axis_auto: '横轴：自动', axis_days: '{n} 天', axis_1y: '1 年', axis_3y: '3 年',
  example_reset: '↺ 示例恢复默认', example_reset_title: '把三组情绪 / 重要、首尾加成和横轴恢复默认（不动左边的参数）',
  y_label: '强度 S', x_label: '记忆时间（天）', threshold_label: '遗忘阈值 {v}',
  persona: '人设', persona_help: '它是谁、怎么说话、有什么习惯——由你用文字描述，一般几千字以内。回应和主动发消息都用（D29）。存在数据文件夹的 persona.md，保存后立即生效，不用重启。名字请和"它的名字"保持一致。',
  persona_chars: '{n} 字', persona_loaded: '已读入「{f}」，点"保存人设"写入。', persona_saved: '人设已保存到 {p}，立即生效。', persona_save_failed: '保存人设失败：',
  persona_save: '保存人设', persona_from_file: '从文本文件读入…', persona_lib: '人设库…', persona_star: '喜欢的话，建议给原作者点点 ⭐', persona_unreadable: '读不到人设文件',
  libs_title: '人设 / 角色卡来源', libs_note: '都是别人的作品，按各自的许可使用。SillyTavern 格式的角色卡是 PNG 或 JSON，把里面 description / personality 的文字复制进来就行；AstrBot 人格市场的可以直接用。', libs_zh: '中文', libs_en: '英文', libs_close: '关闭',
  persona_also_saved: ' 人设也已保存，立即生效。', persona_also_failed: ' 人设保存失败：',
  astrbot_none: '未检测到 AstrBot 配置（数据文件夹/astrbot/cmd_config.json）', astrbot_follow: '以此为准',
};
const t = key => (lang === 'en' && EN.ui?.[key]) || ZH[key];
const tt = (key, vars) => Object.entries(vars).reduce((acc, [k, v]) => acc.replace('{' + k + '}', v), t(key));  // 带占位符的文案
const tgroup = title => (lang === 'en' && EN.groups?.[title]) || title;
// 分区、参数、功能、词表的译文：英文缺条目时回落到登记的中文
// 文案里的 {name} 换成用户给它起的名字（设置里的"它的名字"）
const aiName = () => (state.general?.ai_name || SCHEMA.sections[0].fields.find(x => x.key === 'ai_name')?.default || 'AI');
const nm = s => String(s ?? '').replace(/\{name\}/g, aiName());
const tsec = sec => { const e = (lang === 'en' && EN.sections?.[sec.id]) || sec; return { ...sec, title: nm(e.title), help: nm(e.help) }; };
const tf = (secId, f) => {
  const e = lang === 'en' ? EN.fields?.[`${secId}.${f.key}`] : null;
  const out = !e ? { ...f } : { ...f, label: e.label || f.label, help: e.help || f.help, option_labels: e.options || f.option_labels,
           unit: (EN.units?.[f.unit]) || f.unit, warnings: e.warnings ? { ...f.warnings, ...e.warnings } : f.warnings };
  out.label = nm(out.label); out.help = nm(out.help);
  return out;
};
const tfeat = f => { const e = (lang === 'en' && EN.features?.[f.key]) ? { ...f, ...EN.features[f.key] } : { ...f }; e.label = nm(e.label); e.help = nm(e.help); return e; };
const tword = w => (lang === 'en' && EN.word_lists?.[w.key]) ? { ...w, ...EN.word_lists[w.key] } : w;

function fmt(v) { return typeof v === 'number' ? String(+v.toFixed(6)) : String(v); }

function numberRow(secId, f) {
  f = tf(secId, f);
  const cur = state[secId]?.[f.key];
  const val = cur ?? f.default;
  const row = h('div', { class: 'row' });
  const num = h('input', { type: 'number', step: f.step, 'aria-label': f.label });
  if (f.min != null) num.min = f.min; if (f.max != null) num.max = f.max;
  num.value = val;
  const ctl = h('div', { class: 'ctl' });
  let range = null;
  if (f.min != null && f.max != null) {
    range = h('input', { type: 'range', min: f.min, max: f.max, step: f.step, 'aria-hidden': 'true', tabindex: '-1' });
    range.value = val;
    range.addEventListener('input', () => { num.value = range.value; set(+range.value); });
    ctl.append(range);
  }
  ctl.append(num);
  if (f.unit) ctl.append(h('span', { class: 'unit' }, f.unit));
  const set = v => {
    if (Number.isNaN(v)) return;
    state[secId] ??= {};
    if (v === f.default) delete state[secId][f.key]; else state[secId][f.key] = v;
    row.classList.toggle('changed', v !== f.default);
    refreshPreview(secId);
  };
  num.addEventListener('input', () => { if (range) range.value = num.value; set(f.type === 'int' ? Math.round(+num.value) : +num.value); });
  const reset = h('button', { class: 'reset', type: 'button', title: t('reset'), onclick: () => { num.value = f.default; if (range) range.value = f.default; set(f.default); } }, '↺');
  row.append(h('label', {}, f.label, q(f.help)), ctl, h('span', { class: 'dflt' }, `${t('default')} ${fmt(f.default)}`, reset));
  row.classList.toggle('changed', cur != null && cur !== f.default);
  return row;
}

function inputRow(secId, f) {
  f = tf(secId, f);
  const cur = state[secId]?.[f.key];
  const val = cur ?? f.default;
  const row = h('div', { class: 'row' });
  let el;
  if (f.type === 'select') {
    el = h('select', { 'aria-label': f.label }, f.options.map((o, i) => h('option', { value: o }, f.option_labels?.[i] ?? String(o))));
    el.value = String(val);
  } else if (f.type === 'bool') {
    el = h('input', { type: 'checkbox', 'aria-label': f.label }); el.checked = !!val;
  } else {

function defaultRows(raw) {

// 自主行为：次数和窗口期是一对，合成一行"最多 n 次 / 每 d 天"，只用数字框（用户：拖动和输入重复了）
function actionRows(raw) {
  const rows = [], done = new Set();
  for (const f of raw.fields) {
    if (done.has(f.key) || !visible(raw.id, f)) continue;
    const m = /^(.*)_times$/.exec(f.key);
    const days = m && raw.fields.find(x => x.key === m[1] + '_days');
    if (!days) { rows.push(f.type === 'int' || f.type === 'float' ? numberRow(raw.id, f) : inputRow(raw.id, f)); continue; }
    done.add(days.key);
    const ft = tf(raw.id, f), fd = tf(raw.id, days);
    const row = h('div', { class: 'row' });
    const mk = (g, after) => {
      const inp = h('input', { type: 'number', min: g.min, max: g.max, step: g.step, 'aria-label': g.label });
      inp.value = state[raw.id]?.[g.key] ?? g.default;
      inp.addEventListener('input', () => {
        let v = g.type === 'int' ? Math.round(+inp.value) : +inp.value;
        if (Number.isNaN(v)) return;
        if (g.min != null) v = Math.max(g.min, v); if (g.max != null) v = Math.min(g.max, v);
        state[raw.id] ??= {};
        if (v === g.default) delete state[raw.id][g.key]; else state[raw.id][g.key] = v;
        row.classList.toggle('changed', (state[raw.id][f.key] != null) || (state[raw.id][days.key] != null));
      });
      return inp;
    };
    const name = ft.label.split(/[：:]/)[0];
    row.append(h('label', {}, name, q(`${ft.help} ${fd.help}`)),
      h('div', { class: 'ctl' }, h('span', { class: 'pair' }, t('at_most'), mk(ft), t('times_every'), mk(fd), t('days_in'))),
      h('span', { class: 'dflt' }, `${t('default')} ${tt('pair_default', { n: fmt(ft.default), d: fmt(fd.default) })}`));
    row.classList.toggle('changed', state[raw.id]?.[f.key] != null || state[raw.id]?.[days.key] != null);
    rows.push(row);
  }
  return rows;
}

// 遗忘曲线：三条曲线 = 三段记忆（浅 / 中 / 高情绪与重要性），横轴记忆时间（天），纵轴强度 S
function forgettingChart(box) {
  const g = k => +cur('forgetting', k);
  const model = cur('forgetting', 'decay_model');
  const P = PREVIEW_STATE.forgetting, D = PREVIEW_DEFAULTS.forgetting();
  const halfLife = (a, i) => g('base_half_life') * Math.pow(g('emotion_max'), a) * Math.pow(g('importance_max'), i) * (P.edge ? g('position_bonus') : 1);
  const S = (H, t) => model === '幂律衰减' ? 1 / (1 + t / H) : model === '不遗忘' ? 1 : Math.pow(0.5, t / H);
  const line = g('forget_line');
  const colors = ['#8aa4b8', '#e0a458', '#e5665b'];
  const names = [t('lv1'), t('lv2'), t('lv3')];
  const Hs = P.levels.map(l => halfLife(l.a, l.i));
  // 横轴：自动时看到中间那条跌破遗忘线为止（最强的那条会出框，图例里写着它多久跌破）；也可手选范围
  const forgetDaysAt = (H, l) => model === '幂律衰减' ? H * (1 / l - 1) : model === '不遗忘' ? 365 : H * Math.log2(1 / l);
  const forgetDays = H => forgetDaysAt(H, line);
  const maxDays = P.span || Math.min(3650, Math.max(14, forgetDaysAt(Hs[1], 0.1) * 1.25));  // 范围按固定 0.1 算：改阈值只动虚线，不动横轴
  const W = 440, Ht = 230, L = 40, R = 12, T = 14, B = 32;
  const x = d => L + (d / maxDays) * (W - L - R), y = s => T + (1 - s) * (Ht - T - B);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${Ht}`); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', t('chart_title'));
  const el = (tag, attrs, text) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; svg.append(e); return e; };
  for (const s of [0.25, 0.5, 0.75, 1]) { el('line', { class: 'grid', x1: L, x2: W - R, y1: y(s), y2: y(s) }); el('text', { x: L - 6, y: y(s) + 4, 'text-anchor': 'end' }, s.toFixed(2)); }
  const step = [1, 2, 5, 7, 14, 30, 60, 90, 180, 365, 730, 1825].find(s => maxDays / s <= 8) || 1825;
  for (let d = 0; d <= maxDays; d += step) { el('line', { class: 'grid', x1: x(d), x2: x(d), y1: T, y2: Ht - B }); el('text', { x: x(d), y: Ht - B + 14, 'text-anchor': 'middle' }, String(d)); }
  el('line', { class: 'axis', x1: L, x2: W - R, y1: Ht - B, y2: Ht - B }); el('line', { class: 'axis', x1: L, x2: L, y1: T, y2: Ht - B });
  el('text', { x: W - R, y: Ht - 4, 'text-anchor': 'end' }, t('x_label')); el('text', { x: L + 4, y: T + 10 }, t('y_label'));
  el('line', { class: 'line', x1: L, x2: W - R, y1: y(line), y2: y(line) }); el('text', { x: W - R - 4, y: y(line) - 4, 'text-anchor': 'end' }, tt('threshold_label', { v: line }));
  Hs.forEach((H, k) => {
    const pts = []; const n = 160;
    for (let j = 0; j <= n; j++) { const d = (j / n) * maxDays; pts.push(`${x(d).toFixed(1)},${y(Math.max(0, Math.min(1, S(H, d)))).toFixed(1)}`); }
    el('path', { class: 'curve', d: 'M' + pts.join(' L'), stroke: colors[k] });
    const fd = forgetDays(H);
    if (model !== '不遗忘' && fd <= maxDays) el('circle', { cx: x(fd), cy: y(line), r: 3.5, fill: colors[k] });
  });
  const legend = h('div', { class: 'legend' });
  P.levels.forEach((l, k) => {
    const H = Hs[k], fd = forgetDays(H);
    const mk = (key, label) => { const inp = h('input', { type: 'number', min: 0, max: 1, step: 0.1, value: l[key], 'aria-label': `${names[k]} ${label}` });
      inp.addEventListener('input', () => { const v = Math.min(1, Math.max(0, +inp.value || 0)); l[key] = v; refreshPreview('forgetting'); }); return inp; };
    legend.append(h('span', {}, h('i', { style: `background:${colors[k]}` }), h('b', { style: 'font-weight:600' }, names[k]),
      t('emotion'), mk('a', t('emotion')), q(t('emotion_help')),
      t('importance'), mk('i', t('importance')), q(t('importance_help')),
      h('span', { class: 'unit' }, `${model === '不遗忘' ? t('never_forget') : tt('forget_after', { d: fmt(+fd.toFixed(0)) })}${tt('half_life', { h: fmt(+H.toFixed(1)) })}　${tt('level_default', { a: D.levels[k].a, i: D.levels[k].i })}`)));
  });
  const edge = h('input', { type: 'checkbox' }); edge.checked = P.edge;
  edge.addEventListener('change', () => { P.edge = edge.checked; refreshPreview('forgetting'); });
  legend.append(h('label', { style: 'display:inline-flex;gap:6px;align-items:center' }, edge, t('edge_label')));
  const span = h('select', { 'aria-label': t('axis') }, [[0, t('axis_auto')], [30, tt('axis_days', { n: 30 })], [90, tt('axis_days', { n: 90 })], [365, t('axis_1y')], [1095, t('axis_3y')]].map(([v, l]) => h('option', { value: v }, l)));
  span.value = String(P.span); span.addEventListener('change', () => { P.span = +span.value; refreshPreview('forgetting'); });
  const resetAll = h('button', { type: 'button', title: t('example_reset_title'),
    onclick: () => { PREVIEW_STATE.forgetting = PREVIEW_DEFAULTS.forgetting(); refreshPreview('forgetting'); } }, t('example_reset'));
  legend.append(h('span', { style: 'border-top:none' }, span, resetAll));
  box.append(
    h('div', { class: 'head' }, t('chart_title'), q(t('chart_help'))),
    h('p', { class: 'note' }, t('chart_note')),
    svg, legend,
  );
}

// 人设：直接在这里写，或选一个文本文件读进来；存到数据文件夹的 persona.md，改了立即生效（D29）
let PERSONA = { path: '', text: '', loaded: false, draft: null };  // text：文件里的；draft：正在编辑的
const personaDirty = () => PERSONA.loaded && PERSONA.draft != null && PERSONA.draft !== PERSONA.text;
async function savePersona(opts = {}) {
  const r = await fetch('/api/persona', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: PERSONA.draft ?? PERSONA.text }), ...opts });
  if (!r.ok) throw new Error((await r.json()).error);
  const d = await r.json(); PERSONA.path = d.path; PERSONA.text = PERSONA.draft ?? PERSONA.text; return d;
}
function personaSection() {
  const sec = h('section', { id: 'persona', class: 'persona' }, h('h2', {}, t('persona')), h('p', {}, t('persona_help')));
  const ta = h('textarea', { 'aria-label': t('persona') });  // 不放默认文字，保持空白（用户定）
  const count = h('span', { class: 'unit' });
  const file = h('input', { type: 'file', accept: '.md,.txt,text/plain,text/markdown', style: 'display:none' });
  const upd = () => { count.textContent = `${tt('persona_chars', { n: ta.value.length })}${PERSONA.path ? ' · ' + PERSONA.path : ''}`; };
  ta.addEventListener('input', () => { PERSONA.draft = ta.value; upd(); });
  file.addEventListener('change', async () => { const f = file.files[0]; if (!f) return; ta.value = await f.text(); PERSONA.draft = ta.value; upd(); notice(tt('persona_loaded', { f: f.name })); });
  const save = h('button', { class: 'primary', type: 'button', onclick: async () => {
    PERSONA.draft = ta.value;
    try { const d = await savePersona(); upd(); notice(tt('persona_saved', { p: `<code>${d.path}</code>` })); }
    catch (e) { notice(t('persona_save_failed') + e.message); }
  } }, t('persona_save'));
  sec.append(ta, h('div', { class: 'bar' }, save, h('button', { type: 'button', onclick: () => file.click() }, t('persona_from_file')), file,
    h('a', { class: 'ext', href: '#', onclick: e => { e.preventDefault(); personaLibs(); } }, t('persona_lib')), h('span', { class: 'unit' }, t('persona_star')), count));
  const fill = () => { ta.value = PERSONA.draft ?? PERSONA.text; upd(); };
  if (PERSONA.loaded) fill();
  else fetch('/api/persona').then(r => r.json()).then(d => { PERSONA = { ...d, loaded: true }; fill(); }).catch(() => { count.textContent = t('persona_unreadable'); });
  return sec;
}

function notice(html) { const n = $('#notice'); n.innerHTML = html; n.classList.add('show'); }

let PATH = '';
async function load() {
  const r = await fetch('/api/settings');
  const data = await r.json();
  SCHEMA = data.schema; state = data.values || {}; EN = data.en || {}; PATH = data.path; ASTRBOT = data.astrbot || [];
  SAVED = JSON.stringify(state);
  render();
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();  // 带 #分区 打开时直接跳过去
}
$('#lang').addEventListener('click', () => {
  lang = lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('humanlike.lang', lang); } catch (e) {}
  render();
});

// 顶部"保存"：存全部设置，人设有改动也一起存；"保存人设"只存人设
let SAVED = '';  // 上次保存时的设置，用来判断有没有没存的改动
$('#save').addEventListener('click', async () => {
  const r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state) });
  if (!r.ok) { notice(t('save_failed') + (await r.json()).error); return; }
  const data = await r.json();
  state = data.saved; SAVED = JSON.stringify(state);
  let extra = '';
  if (personaDirty()) { try { await savePersona(); extra = t('persona_also_saved'); } catch (e) { extra = t('persona_also_failed') + e.message; } }
  render();
  notice(`${t('saved')}<code>${data.path}</code>. ${t('restart_hint').replace('docker compose restart astrbot', '<code>docker compose restart astrbot</code>')}${extra}`);
});
// 没保存就关掉页面：自动保存（用户 2026-11-02 定）。keepalive 让请求在页面关闭后也能发完
window.addEventListener('pagehide', () => {
  if (SAVED && JSON.stringify(state) !== SAVED) {
    fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state), keepalive: true }).catch(() => {});
  }
  if (personaDirty()) savePersona({ keepalive: true }).catch(() => {});
});
$('#resetAll').addEventListener('click', () => {
  if (!confirm(t('confirm_restore'))) return;
  state = {}; render(); notice(t('restored'));
});
load().catch(e => notice(t('load_failed') + e.message));
</script>
