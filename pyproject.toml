[project]
name = "humanlike-ai"
version = "0.0.1"
description = "类人 AI：记忆、情绪、回应、行动"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: 真实调用 DeepSeek API 和本地 Qwen，默认跳过；用 pytest -m live 运行"]

[tool.ruff]
line-length = 110
src = ["src"]
