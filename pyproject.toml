[project]
name = "humanlike-ai"
version = "0.0.1"
description = "类人 AI：记忆、情绪、回应、行动"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"  # D33：AstrBot 是 AGPL-3.0，插件在它里面运行
license-files = ["LICENSE"]
dependencies = [
    "jieba>=0.42",  # 事件线候选的关键词检索（用户方案：jieba 分词 + BM25）
    # 读用户发来的文件（D38）
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: 真实调用 DeepSeek API 和本地 Qwen，默认跳过；用 pytest -m live 运行"]

[tool.ruff]
line-length = 110
src = ["src"]
